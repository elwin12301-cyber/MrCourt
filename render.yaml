# Render Blueprint: one web service (website + API in a Docker container) and a PostgreSQL database.
# In Render: New > Blueprint > pick this repository. Fill the values marked "sync: false" when asked.
services:
  - type: web
    name: mrcourt
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mrcourt-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: REMINDER_INTERVAL_MINUTES
        value: "60"
      # First administrator, created on the first start (password at least 12 characters).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Text messages (sign-up codes, password reset, hearing reminders). Without it codes cannot be delivered.
      - key: FAST2SMS_API_KEY
        sync: false
      # Optional services; leave empty to switch the feature off.
      - key: VOYAGE_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # WhatsApp channel (feature 010). "none" keeps it off. For Meta: set "meta" and the values below, then give Meta
      # this webhook address: https://<your service>.onrender.com/api/v1/whatsapp/webhook
      - key: WHATSAPP_PROVIDER
        value: none
      - key: PUBLIC_APP_URL
        sync: false
      - key: FAST2SMS_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FAST2SMS_WHATSAPP_TEMPLATE_CODE
        sync: false
      - key: FAST2SMS_WHATSAPP_TEMPLATE_REMINDER
        sync: false
      - key: FAST2SMS_WHATSAPP_TEMPLATE_UPDATE
        sync: false
      - key: FAST2SMS_WHATSAPP_TEMPLATE_ACTIVITY
        sync: false
      - key: FAST2SMS_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

databases:
  - name: mrcourt-db
    plan: free
    databaseName: mrcourt
    user: mrcourt
